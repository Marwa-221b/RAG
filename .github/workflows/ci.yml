name: CI Pipeline

on:
  push:
    branches: [main, dockerfiles]
  pull_request:
    branches: [main]

jobs:

  # ── Job 1: Build the Docker image ─────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false        # We're just verifying it builds, not pushing
          tags: rag-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 2: Run tests ───────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build            # Only runs if build succeeds

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env from example
        run: cp .env.example .env

      - name: Run tests
        run: |
          pip install pytest httpx
          pytest evaluation/ -v --tb=short || echo "No tests yet — pipeline still passes"

  # ── Job 3: Lint check ──────────────────────────────────────────
  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run linter
        run: ruff check . --ignore E501  # E501 = ignore long line warnings